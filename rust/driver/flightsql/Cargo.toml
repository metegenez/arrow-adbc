[package]
name = "adbc_flightsql"
description = "Apache Arrow Flight SQL ADBC driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
documentation = "http://docs.rs/adbc_flightsql/"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
ffi = ["dep:adbc_ffi"]

[dependencies]
adbc_core.workspace = true
adbc_ffi = { workspace = true, optional = true }
arrow-flight = { workspace = true, features = ["flight-sql"] }
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
futures = "0.3"
tokio = { version = "1.52", features = ["rt-multi-thread"] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
url = "2.5.8"
rustls-native-certs = "0.8.3"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
adbc_driver_manager.workspace = true
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
arrow-ipc = "58"
tokio-stream = "0.1"
rusqlite = { version = "0.33", features = ["bundled"] }

[lib]
crate-type = ["lib", "cdylib"]
